name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e

            # Load Node.js installed with NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            nvm use v22.23.2

            # Ensure Node binaries are available
            export PATH="$HOME/.nvm/versions/node/v22.23.2/bin:$PATH"

            echo "Node Version:"
            node -v

            echo "PNPM Version:"
            pnpm -v

            echo "PM2 Version:"
            pm2 -v

            cd /home/ubuntu/Chore-Robotics

            echo "Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            pnpm install --frozen-lockfile

            echo "Building project..."
            pnpm run build

            echo "Restarting application..."

            if pm2 describe chore-web > /dev/null 2>&1; then
              pm2 restart chore-web --update-env
            else
              pm2 start pnpm --name chore-web -- start
            fi

            pm2 save

            echo "Deployment completed successfully."
